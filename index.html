function loadScript(src){return new Promise((resolve,reject)=>{if(window.JSZip)return resolve();const s=document.createElement('script');s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error('파일 분석 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));document.head.appendChild(s)})}
async function extractPdf(file){const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.mjs';const doc=await pdfjs.getDocument({data:await file.arrayBuffer(),useSystemFonts:true}).promise;if(doc.numPages>300)throw new Error('PDF는 300페이지 이하만 처리합니다. 필요한 페이지만 나누어 올려주세요.');const sections=[];let textPages=0;for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const content=await page.getTextContent();const text=content.items.map(x=>x.str||'').filter(Boolean).join(' ').replace(/\s+/g,' ').trim();if(text)textPages++;sections.push({label:`PDF p. ${i}`,text,warning:text?'':'텍스트 없음 · 스캔 이미지일 수 있음'})}if(!textPages)throw new Error('PDF에서 텍스트를 추출하지 못했습니다. 스캔 이미지일 수 있으며 OCR은 지원하지 않습니다. 텍스트 PDF로 저장하거나 본문을 붙여넣어 주세요.');return{sections,warning:textPages<doc.numPages?`전체 ${doc.numPages}페이지 중 ${textPages}페이지에서 텍스트를 추출했습니다. 텍스트가 없는 페이지는 스캔 이미지 또는 빈 페이지일 수 있으며 OCR은 지원하지 않습니다.`:''}}
async function extractPptx(file){await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');const zip=await JSZip.loadAsync(file);const expanded=Object.values(zip.files).reduce((n,x)=>n+(x._data?.uncompressedSize||0),0);if(expanded>100*1024*1024)throw new Error('압축 해제된 PPTX 내용이 100MB를 초과합니다. 파일을 나누어 올려주세요.');const entries=Object.keys(zip.files).map(name=>{const m=name.match(/^ppt\/slides\/slide(\d+)\.xml$/);return m?{name,num:Number(m[1])}:null}).filter(Boolean).sort((a,b)=>a.num-b.num);if(!entries.length)throw new Error('PPTX 슬라이드 파일을 찾지 못했습니다. 파일이 손상되었거나 암호로 보호되어 있을 수 있습니다.');if(entries.length>300)throw new Error('PPTX는 300장 이하만 처리합니다. 필요한 슬라이드만 분리해 주세요.');const sections=[];let visualObjects=false;for(const entry of entries){const xml=await zip.file(entry.name).async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))throw new Error('PPTX 슬라이드 XML을 읽지 못했습니다. 손상 파일일 수 있습니다.');const paragraphs=[...doc.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent||'').join('')).filter(Boolean);const text=paragraphs.join('\n').trim();if(doc.getElementsByTagNameNS('*','pic').length||doc.getElementsByTagNameNS('*','graphicFrame').length)visualObjects=true;sections.push({label:`PPTX 슬라이드 ${entry.num}`,text,warning:text?'':'추출 가능한 텍스트 없음 · 이미지 또는 빈 슬라이드일 수 있음'})}if(!sections.some(x=>x.text))throw new Error('PPTX에서 텍스트를 추출하지 못했습니다. 스캔 이미지·도형 이미지의 OCR은 지원하지 않습니다.');return{sections,warning:visualObjects?'텍스트 상자와 표의 텍스트를 추출했습니다. 이미지·차트·도형의 글자 및 시각적 의미는 추출·평가하지 않으므로 원본 슬라이드도 확인하세요.':''}}
function formatSections(sections){return sections.map(x=>`【${x.label}】\n${x.text||x.warning}`).join('\n\n')}
async function readFile(el){const f=el.files&&el.files[0];if(!f)return;if(f.size>MAX_UPLOAD_BYTES){fileStatus('파일이 10MB를 초과합니다. 파일을 나누거나 본문을 직접 붙여넣어 주세요.','warn');el.value='';return}const ext=(f.name.split('.').pop()||'').toLowerCase();if(!['txt','pdf','pptx','ppt'].includes(ext)){fileStatus('지원 형식은 TXT, PDF, PPTX, PPT입니다.','warn');el.value='';return}fileStatus(`${f.name} · ${(f.size/1024/1024).toFixed(2)}MB · 브라우저에서 분석 중…`);try{let result;if(ext==='txt'){const text=await f.text();if(!text.trim())throw new Error('TXT에 읽을 수 있는 본문이 없습니다.');result={sections:[{label:'TXT',text}]}}else if(ext==='pdf')result=await extractPdf(f);else if(ext==='pptx')result=await extractPptx(f);else throw new Error('구형 PowerPoint .ppt 파일은 현재 브라우저 추출기에서 지원하지 않습니다. PowerPoint에서 .pptx 또는 PDF로 저장한 뒤 업로드해 주세요. 파일은 서버로 전송되지 않습니다.');const extracted=formatSections(result.sections);if(state.plan&&state.plan.trim()&&!confirm('현재 본문을 추출한 파일 내용으로 바꿀까요? 기존 본문은 유지하려면 취소를 누르세요.')){fileStatus('기존 본문을 유지했습니다. 추출된 새 파일 내용은 적용하지 않았습니다.');return}state.plan=extracted;state.extractedSections=result.sections;state.uploadName=f.name;state.review=[];render();fileStatus(`${f.name} · ${result.sections.length}개 페이지/슬라이드 단위 · 추출 완료${result.warning?' — '+result.warning:''}`,result.warning?'warn':'notice')}catch(e){let why=e.message||'손상되었거나 지원하지 않는 파일입니다.';if(e.name==='PasswordException')why='암호로 보호된 PDF입니다. 암호를 해제해 다시 저장한 뒤 업로드해 주세요.';else if(ext==='pdf'&&!/라이브러리|OCR|300페이지/.test(why))why='PDF 구조를 읽을 수 없습니다. 암호로 보호되었거나 파일이 손상되었을 수 있습니다. 암호를 해제해 다시 저장해 주세요.';else if(ext==='pptx'&&!/라이브러리|100MB|300장|텍스트를 추출하지 못/.test(why))why='PPTX를 열 수 없습니다. 암호로 보호되었거나 파일이 손상되었을 수 있습니다. 암호 해제 후 다시 저장해 주세요.';fileStatus(`추출 실패 · ${why} 기존 본문은 유지했습니다.`, 'warn')}}
function review(){state.review=[];const p=state.plan;if(!p.trim())return toast('본문을 입력하거나 파일을 업로드하세요');const criteria=[['고객·문제',/고객|대상|문제|불편|사용자|페르소나/i,'고객과 문제를 구체적인 인터뷰·관찰 근거와 연결해 보세요.'],['해결책·차별성',/해결|서비스|제품|기능|차별|아이디어/i,'해결 기능이 고객 문제를 어떻게 줄이는지 근거와 연결해 보세요.'],['시장·사업성',/시장|경쟁|매출|수익|가격|TAM|SAM|SOM/i,'시장·경쟁·가격 주장을 출처 또는 계산 가정과 연결해 보세요.'],['실행 가능성',/실행|일정|인력|팀|예산|비용|시제품|프로토타입/i,'팀 역량·일정·비용과 검증 계획을 구체화해 보세요.'],['논리·근거·전달력',/조사|인터뷰|설문|통계|출처|근거|검증|실증/i,'주요 주장을 뒷받침하는 자료의 출처·시점·조사 방법을 표시해 보세요.']];const re=/【(PDF p\.\s*\d+|PPTX 슬라이드 \d+|TXT)】/g;const matches=[...p.matchAll(re)];const blocks=matches.length?matches.map((m,i)=>({label:m[1],text:p.slice(m.index+m[0].length,i+1<matches.length?matches[i+1].index:p.length).trim()})):[{label:'직접 입력 본문',text:p}];for(const [title,pattern,suggestion] of criteria){const found=[];for(const b of blocks){const snippets=b.text.split(/[\n.!?。]+/).map(x=>x.trim()).filter(x=>x&&pattern.test(x));if(snippets.length)found.push({label:b.label,quote:snippets[0].slice(0,220)})}state.review.push({title,source:found.map(x=>x.label).join(' · '),quote:found.map(x=>`“${x.quote}”`).join(' / ')||'확인할 자료 없음 · 추출 본문에서 기준 관련 표현을 찾지 못했습니다.',status:found.length?'관련 문구 발견 · 내용의 타당성은 별도 확인 필요':'확인할 자료 없음',suggestion})}render()}
